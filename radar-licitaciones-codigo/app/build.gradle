plugins {
    id 'com.android.application'
}

// En GitHub, cada construcción sube el número de versión sola.
def numero = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as Integer

android {
    namespace 'com.elian.radar'
    compileSdk 35

    defaultConfig {
        applicationId 'com.elian.radar'
        minSdk 26
        targetSdk 35
        versionCode numero
        versionName "1.0.${numero}"
    }

    signingConfigs {
        release {
            storeFile file('radar.jks')
            storePassword System.getenv('KEYSTORE_PASS')
            keyAlias 'radar'
            keyPassword System.getenv('KEYSTORE_PASS')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
